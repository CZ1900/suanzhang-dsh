name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 语法校验（node --check，不解析外部依赖）
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/pricing.js
      - name: 运行单测
        run: npm test
